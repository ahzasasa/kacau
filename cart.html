<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KACAU - Keranjang</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding-bottom: 120px;">
    <nav class="navbar">
        <div class="logo">KACAU</div>
        <div class="nav-links">
            <a href="home.html">HOME</a>
            <a href="about.html">TEAM</a>
            <a href="index.html">MENU</a>
            <a href="cart.html" class="active">CART</a>
        </div>
    </nav>

    <main class="container" style="padding-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 0.85rem; color: var(--c-purple);">KERANJANG PESANAN</h2>
            <a href="index.html" class="btn" style="padding: 8px 12px; font-size: 0.5rem; text-decoration: none;">← KEMBALI KE MENU</a>
        </div>

        <!-- select all & delete selected bar -->
        <div id="select-all-bar" style="display: flex; justify-content: space-between; align-items: center; background: var(--c-yellow); border: 3px solid var(--c-purple); padding: 10px 12px; margin-bottom: 15px; box-shadow: 3px 3px 0 rgba(69, 12, 63, 0.2);">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.55rem; color: var(--c-purple); cursor: pointer;">
                <input type="checkbox" id="select-all-checkbox" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--c-purple);">
                <label for="select-all-checkbox" style="font-size: 0.6rem; color: var(--c-purple); font-weight: bold; cursor: pointer;">PILIH SEMUA</label>
            </label>
            <button id="delete-selected-btn" style="background: none; border: none; font-family: 'Press Start 2P', cursive; font-size: 0.55rem; color: #c0392b; cursor: pointer;">[HAPUS TERPILIH]</button>
        </div>

        <div id="cart-items-container"></div>
    </main>

    <!-- bottom bar checkout -->
    <footer class="bottom-bar" style="position: fixed; bottom: 0; left: 0; width: 100%; background: var(--c-green-light); border-top: 4px solid var(--c-purple); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 99;">
        <div>
            <div style="font-size: 0.5rem; color: var(--c-purple); margin-bottom: 4px;">TOTAL (<span id="checked-count">0</span>)</div>
            <div style="font-size: 0.8rem; font-weight: bold; color: var(--c-purple);">RP <span id="cart-grand-total">0</span></div>
        </div>
        <button id="cart-checkout-btn" class="btn btn-invert" style="padding: 12px 20px; font-size: 0.65rem;">CHECKOUT</button>
    </footer>


    <!-- pembayaran QRIS -->
    <div id="qris-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 330px; text-align: center; padding: 20px;">
            <h3 style="font-family: 'Press Start 2P', cursive; font-size: 0.75rem; margin-bottom: 12px; color: var(--c-purple);">PEMBAYARAN QRIS</h3>
            
            <!-- form pembayaran & QRIS -->
            <div id="modal-step-input">
                <div style="text-align: center; margin: 8px 0;">
                    <img id="qris-image" src="qirs-farrel.jpg" alt="QRIS GoPay" style="width: 190px; height: 190px; border: 3px solid var(--c-purple); background: #fff; object-fit: contain;">
                </div>
    
                <div style="background: var(--c-yellow); border: 3px solid var(--c-purple); padding: 8px; margin: 10px 0;">
                    <p style="font-family: 'Press Start 2P', cursive; font-size: 0.5rem; color: var(--c-purple); margin-bottom: 4px;">TOTAL TAGIHAN:</p>
                    <p style="font-family: 'Press Start 2P', cursive; font-size: 0.85rem; color: var(--c-purple); font-weight: bold; margin: 0;">
                        RP <span id="modal-pay-total">0</span>
                    </p>
                </div>

                <div style="margin-bottom: 12px; text-align: left;">
                    <label style="font-size: 0.55rem; color: var(--c-purple); display: block; margin-bottom: 4px; font-weight: bold;">NAMA:</label>
                    <input type="text" id="buyer-name" placeholder="Isi nama kamu." style="width: 100%; padding: 8px; border: 2px solid var(--c-purple); font-family: inherit; font-size: 0.6rem; box-sizing: border-box;">
                </div>
                
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="font-size: 0.55rem; color: var(--c-purple); display: block; margin-bottom: 4px; font-weight: bold;">PRODI:</label>
                    <input type="text" id="buyer-prodi" placeholder="Isi prodi kamu." style="width: 100%; padding: 8px; border: 2px solid var(--c-purple); font-family: inherit; font-size: 0.6rem; box-sizing: border-box;">
                </div>
    
                <div style="display: flex; gap: 8px; justify-content: center;">
                    <button id="close-qris-btn" class="btn" style="flex: 1; padding: 10px 5px; font-size: 0.5rem;">BATAL</button>
                    <button id="confirm-pay-btn" class="btn btn-invert" style="flex: 1.2; padding: 10px 5px; font-size: 0.5rem;">SUDAH BAYAR</button>
                </div>
            </div>
    
            <!-- Konfirmasi Kasir -->
            <div id="modal-step-waiting" style="display: none; padding: 10px 0;">
                <div style="font-size: 2rem; margin-bottom: 10px;">⏳</div>
                <h4 style="font-family: 'Press Start 2P', cursive; font-size: 0.65rem; color: var(--c-purple); margin-bottom: 10px;">MENUNGGU KONFIRMASI KASIR</h4>
                
                <p style="font-size: 0.55rem; color: var(--c-purple); line-height: 1.4; margin-bottom: 15px;">
                    Pesanan kamu <b id="waiting-order-id">REQ-000</b> sudah terdaftar.<br>
                    Klik tombol konfirmasi di bawah untuk cetak nota.
                </p>

                <div id="waiting-status-badge" style="background: var(--c-yellow); border: 2px solid var(--c-purple); padding: 8px; font-family: 'Press Start 2P', cursive; font-size: 0.5rem; color: var(--c-purple); margin-bottom: 12px;">
                    STATUS: MENUNGGU KASIR
                </div>

                <a id="wa-confirm-link" href="https://wa.me/6281233209503" target="_blank" class="btn" style="display: block; width: 100%; padding: 10px 5px; font-size: 0.55rem; background: var(--c-purple); color: var(--c-yellow); border: 2px solid var(--c-purple); text-decoration: none; text-align: center; box-sizing: border-box;">
                    KONFIRMASI
                </a>
            </div>
        </div>
    </div>
    <!-- custom alert -->
    <div id="alert-modal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width: 300px; padding: 20px; text-align: center;">
            <p id="alert-message" style="font-size: 0.6rem; line-height: 1.6; margin-bottom: 20px; color: var(--c-purple);"></p>
            <button id="close-alert-btn" class="btn btn-invert" style="padding: 10px 20px; font-size: 0.55rem;">OK</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="cart.js"></script>
</body>
</html>
