<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KACAU - Dashboard Penjual</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding-top: 20px;">

    <main class="container" style="padding-bottom: 120px;">
        <div class="seller-nav" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="tab-orders-btn" class="tab-btn active" style="flex: 1; padding: 12px; font-size: 0.6rem; cursor: pointer;">PESANAN MASUK</button>
            <button id="tab-rekap-btn" class="tab-btn" style="flex: 1; padding: 12px; font-size: 0.6rem; cursor: pointer;">REKAP PENJUALAN</button>
        </div>

        <!-- tab 1: pesanan masuk -->
        <div id="tab-orders" class="tab-content active">
            <div class="section-header" style="flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 15px;">
                <h2 style="font-size: 1.2rem;">DAFTAR PESANAN</h2>
                <button id="btn-format-data" class="btn btn-invert" style="padding: 10px 15px; font-size: 0.55rem; margin-top: 5px;">HAPUS DATA</button>
            </div>

            <!-- search box -->
            <div class="search-box" style="margin-bottom: 20px; display: flex; gap: 8px;">
                <input type="text" id="search-req-input" placeholder="CARI NO REQ" 
                       style="padding: 10px 12px; font-family: 'Press Start 2P', cursive; font-size: 0.55rem; border: 4px solid var(--c-purple); background: var(--c-yellow); color: var(--c-purple); flex: 1; outline: none;">
                <button id="search-req-btn" class="btn" style="padding: 10px 14px; font-size: 0.55rem; cursor: pointer;">CARI</button>
            </div>

            <div id="quest-log-container"></div>
        </div>

        <!-- tab 2: rekap penjualan -->
        <div id="tab-rekap" class="tab-content" style="display: none;">
            <div class="stats-panel" style="background: var(--c-green-light); border: 4px solid var(--c-purple); padding: 20px; box-shadow: 4px 4px 0 rgba(69, 12, 63, 0.2);">
                <h3 style="font-size: 0.85rem; color: var(--c-purple); margin-bottom: 15px; border-bottom: 4px solid var(--c-purple); padding-bottom: 10px;">REKAP PENJUALAN</h3>
                
                <div class="omzet-box" style="background: var(--c-purple); color: var(--c-yellow); padding: 15px; text-align: center; font-size: 0.75rem; margin-bottom: 15px; font-weight: bold;">
                    OMZET: RP <span id="total-omzet">0</span>
                </div>

                <div style="background: var(--c-yellow); border: 3px solid var(--c-purple); padding: 10px; text-align: center; font-size: 0.55rem; color: var(--c-purple); margin-bottom: 25px;">
                    TOTAL PESANAN SELESAI: <strong id="total-orders-count">0</strong>
                </div>

                <h4 style="font-size: 0.65rem; color: var(--c-purple); margin-bottom: 15px;">VARIAN TERJUAL</h4>
                <div id="base-rekap-list" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px;"></div>

                <h4 style="font-size: 0.65rem; color: var(--c-purple); margin-bottom: 15px;">TOPPING TERJUAL</h4>
                <div id="topping-rekap-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
            </div>

            <!-- manajemen stok -->
            <div style="background: var(--c-yellow); border: 4px solid var(--c-purple); padding: 15px; margin-bottom: 20px; box-shadow: 4px 4px 0 rgba(69, 12, 63, 0.2); margin-top: 20px;">
                <h3 style="font-family: 'Press Start 2P', cursive; font-size: 0.65rem; color: var(--c-purple); margin-bottom: 12px; text-align: center;">MANAJEMEN STOK PRODUK</h3>
                
                <div style="margin-bottom: 15px;">
                    <h4 style="font-family: 'Press Start 2P', cursive; font-size: 0.55rem; color: var(--c-purple); margin-bottom: 8px;">STOK VARIAN:</h4>
                    <div id="seller-base-stock-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>

                <div>
                    <h4 style="font-family: 'Press Start 2P', cursive; font-size: 0.55rem; color: var(--c-purple); margin-bottom: 8px;">STOK TOPPING:</h4>
                    <div id="seller-topping-stock-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- receipt -->
    <div id="seller-receipt-modal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 999;">
        <div class="modal-card" style="background: var(--c-yellow); border: 4px solid var(--c-purple); padding: 20px; width: 90%; max-width: 360px; box-shadow: 6px 6px 0 var(--c-purple); text-align: center; position: relative;">
            <button id="close-receipt-modal" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-family: 'Press Start 2P', cursive; font-size: 0.7rem; color: var(--c-purple); cursor: pointer;">[X]</button>
            
            <h2 style="font-family: 'Press Start 2P', cursive; font-size: 0.8rem; color: var(--c-purple); margin-bottom: 5px;">--- RECEIPT ---</h2>
            <p style="font-family: 'Press Start 2P', cursive; font-size: 0.5rem; color: var(--c-purple); margin-bottom: 15px;">KACAU - STATISTIKA CINCAU</p>

            <div id="receipt-modal-body" style="font-family: 'Press Start 2P', cursive; border-top: 2px dashed var(--c-purple); border-bottom: 2px dashed var(--c-purple); padding: 12px 0; margin-bottom: 15px; text-align: left; font-size: 0.52rem; color: var(--c-purple); line-height: 1.6;">
            </div>

            <button onclick="window.print()" class="btn" style="padding: 8px 16px; font-size: 0.55rem; width: 100%;">CETAK STRUK</button>
        </div>
    </div>

    <!-- custom alert modal -->
    <div id="seller-alert-modal" class="modal-overlay hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000;">
        <div class="modal-card" style="background: var(--c-yellow); border: 4px solid var(--c-purple); padding: 20px; width: 85%; max-width: 320px; box-shadow: 6px 6px 0 var(--c-purple); text-align: center;">
            <h3 style="font-family: 'Press Start 2P', cursive; font-size: 0.7rem; color: var(--c-purple); margin-bottom: 12px; font-weight: bold;">[ INFO KASIR ]</h3>
            
            <p id="seller-alert-message" style="font-family: 'Press Start 2P', cursive; font-size: 0.55rem; line-height: 1.6; margin-bottom: 18px; color: var(--c-purple);">
            </p>

            <button id="close-seller-alert-btn" class="btn" style="padding: 8px 16px; font-size: 0.55rem; width: 100%; background: var(--c-purple); color: var(--c-yellow); border: none; cursor: pointer;">OK</button>
        </div>
    </div>

    <!-- custom confirm modal -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width: 320px; padding: 22px 18px; text-align: center;">
            <h3 style="font-size: 0.75rem; color: var(--c-purple); margin-bottom: 15px; font-weight: bold;">WARNING</h3>
            <p style="font-size: 0.55rem; line-height: 1.6; margin-bottom: 20px; color: var(--c-purple);">
                Yakin reset DB? Data antrean aktif dan riwayat omzet akan di-wipe.
            </p>
            <div style="display: flex; gap: 10px;">
                <button id="cancel-confirm-btn" class="btn" style="flex: 1; padding: 10px; font-size: 0.55rem;">BATAL</button>
                <button id="action-confirm-btn" class="btn btn-invert" style="flex: 1; padding: 10px; font-size: 0.55rem;">YAKIN</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="seller.js"></script>
</body>
</html>
