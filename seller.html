<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KACAU - Dashboard Penjual</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- tab navigation -->
        <div class="seller-nav">
            <button id="tab-orders-btn" class="tab-btn active">PESANAN MASUK</button>
            <button id="tab-stats-btn" class="tab-btn">REKAP PENJUALAN</button>
        </div>

        <!-- tab 1: pesanan masuk -->
        <div id="tab-orders" class="tab-content active">
            <div class="seller-header">
                <div>
                    <h2>QUEST LOG</h2>
                    <p style="font-size: 0.6rem; margin-top: 5px;">PESANAN AKTIF</p>
                </div>
                <button id="clear-all-btn" class="btn btn-invert" style="padding: 10px 15px; font-size: 0.55rem;">FORMAT DATA</button>
            </div>
            <main id="order-container"></main>
        </div>

        <!-- tab 2: diagram batang dan omzet -->
        <div id="tab-stats" class="tab-content">
            <div class="stats-panel">
                <h3 class="stats-title">REKAP PENJUALAN</h3>
                <div class="omzet-box">
                    OMZET: RP <span id="stat-omzet">0</span>
                </div>

                <div class="chart-section">
                    <h4>VARIAN TERJUAL</h4>
                    <div id="chart-varian-list"></div>
                </div>

                <div class="chart-section">
                    <h4>TOPPING TERJUAL</h4>
                    <div id="chart-topping-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- custom confirm -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 320px; padding: 20px;">
            <h3 style="margin-bottom: 15px; color: var(--c-purple);">WARNING</h3>
            <p id="confirm-message" style="font-size: 0.7rem; line-height: 1.6; margin-bottom: 20px; color: var(--c-purple);"></p>
            <div style="display: flex; gap: 10px;">
                <button id="btn-cancel-confirm" class="btn" style="flex: 1; padding: 10px;">BATAL</button>
                <button id="btn-yes-confirm" class="btn btn-invert" style="flex: 1; padding: 10px;">YAKIN</button>
            </div>
        </div>
    </div>

    <script src="seller.js"></script>
</body>
</html>
